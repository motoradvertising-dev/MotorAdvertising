# Configuracion del proyecto Supabase (CLI).
project_id = "seeaexvmdvmlbbezuosm"

# La funcion de formularios es un endpoint PUBLICO llamado desde el sitio
# estatico, asi que NO debe exigir JWT de Supabase. La protegen el honeypot,
# la allowlist de CORS, la validacion y el rate-limit.
[functions.contact-form]
verify_jwt = false

# El generador de reportes de pauta SI exige sesion valida (JWT): el gateway
# rechaza peticiones anonimas y la funcion re-verifica el rol superadmin.
[functions.generate-report]
verify_jwt = true

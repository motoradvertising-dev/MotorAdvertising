<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ttl_login">Motor Advertising | Iniciar sesión</title>
    <meta name="description" content="Accede a tu cuenta de Motor Advertising o crea una nueva con Google o tu correo electrónico.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/assets/favicon.png?v=3">
    <link rel="stylesheet" href="/styles.css?v=5.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    /* ===== LOGIN PAGE ===== */
    .auth-wrap {
        min-height: 100vh; min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 60px;
        position: relative;
        overflow: hidden;
    }
    .auth-wrap::before {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 20%, rgba(15,57,74,.3) 0%, transparent 65%);
        pointer-events: none;
    }

    .auth-card {
        position: relative;
        width: 100%;
        max-width: 440px;
        background: rgba(12, 12, 14, 0.92);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 38px 34px;
        backdrop-filter: blur(10px);
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 8px;
    }
    .auth-logo a {
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 2px;
        color: var(--text-secondary);
        text-decoration: none;
        text-transform: uppercase;
    }
    .auth-logo a:hover { color: var(--text-primary); }

    .auth-title {
        font-family: var(--font-heading);
        font-size: 1.9rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        margin-bottom: 6px;
        color: var(--text-primary);
    }
    .auth-sub {
        text-align: center;
        color: var(--text-secondary);
        font-size: .88rem;
        margin-bottom: 28px;
    }

    /* Tabs */
    .auth-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        background: rgba(255,255,255,.05);
        border: 1px solid var(--glass-border);
        border-radius: 50px;
        padding: 5px;
        margin-bottom: 26px;
    }
    .auth-tab {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-family: var(--font-body);
        font-size: .8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 10px;
        border-radius: 50px;
        cursor: pointer;
        transition: all .25s ease;
    }
    .auth-tab.active {
        background: linear-gradient(135deg, var(--accent-color), #0e7490);
        color: #fff;
    }

    /* Google button */
    .auth-google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 13px;
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        background: #fff;
        color: #1f1f1f;
        font-family: var(--font-body);
        font-size: .9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all .25s ease;
    }
    .auth-google:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255,255,255,.15); }
    .auth-google svg { width: 18px; height: 18px; flex-shrink: 0; }

    .auth-divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 22px 0;
        color: var(--text-secondary);
        font-size: .72rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    .auth-divider::before, .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--glass-border);
    }

    /* Forms */
    .auth-form { display: flex; flex-direction: column; gap: 14px; }
    .auth-form[hidden] { display: none; }
    .auth-field label {
        display: block;
        font-size: .72rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-secondary);
        margin-bottom: 6px;
    }
    .auth-field input {
        width: 100%;
        padding: 13px 16px;
        border-radius: 10px;
        border: 1px solid var(--glass-border);
        background: rgba(255,255,255,.04);
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: .92rem;
        transition: border-color .2s ease;
    }
    .auth-field input:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(15,57,74,.35);
    }

    .auth-submit {
        margin-top: 6px;
        padding: 14px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(135deg, var(--accent-color), #0e7490);
        color: #fff;
        font-family: var(--font-body);
        font-size: .88rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all .25s ease;
    }
    .auth-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
    .auth-submit:disabled { opacity: .6; cursor: wait; transform: none; }

    .auth-msg {
        border-radius: 10px;
        padding: 12px 14px;
        font-size: .85rem;
        line-height: 1.5;
        display: none;
    }
    .auth-msg.show { display: block; }
    .auth-msg.error { background: rgba(200,60,50,.12); border: 1px solid rgba(200,60,50,.4); color: #ff9c92; }
    .auth-msg.ok { background: rgba(40,160,90,.12); border: 1px solid rgba(40,160,90,.4); color: #7fd8a4; }

    /* Selector de tipo de cuenta (registro) */
    .auth-roles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .auth-role {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 10px;
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        background: rgba(255,255,255,.04);
        color: var(--text-secondary);
        cursor: pointer;
        text-align: center;
        transition: all .2s ease;
        font-size: .8rem;
    }
    .auth-role i { font-size: 1.1rem; color: #59a8c4; }
    .auth-role strong {
        color: var(--text-primary);
        font-size: .82rem;
        text-transform: uppercase;
        letter-spacing: .5px;
    }
    .auth-role input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }
    .auth-role.selected {
        border-color: var(--accent-color);
        background: rgba(15,57,74,.25);
        box-shadow: 0 0 0 2px rgba(15,57,74,.4);
    }
    /* Indicador de foco por teclado (el radio real está oculto) */
    .auth-role:focus-within {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(89,168,196,.55);
    }

    .auth-foot {
        margin-top: 22px;
        text-align: center;
        color: var(--text-secondary);
        font-size: .78rem;
        line-height: 1.7;
    }
    .auth-foot a { color: #59a8c4; text-decoration: none; }
    .auth-foot a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo"><a href="/">// Motor Advertising</a></div>
            <h1 class="auth-title" id="auth-title" data-i18n="lgn_title">Bienvenido</h1>
            <p class="auth-sub" id="auth-sub" data-i18n="lgn_sub">Inicia sesión o crea tu cuenta para continuar.</p>

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true" data-i18n="lgn_tab_login">Iniciar sesión</button>
                <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false" data-i18n="lgn_tab_signup">Crear cuenta</button>
            </div>

            <button type="button" class="auth-google" id="btn-google">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.223 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
                <span data-i18n="lgn_google">Continuar con Google</span>
            </button>

            <div class="auth-divider" data-i18n="lgn_divider">o con tu correo</div>

            <!-- LOGIN -->
            <form class="auth-form" id="form-login" novalidate>
                <div class="auth-field">
                    <label for="login-email" data-i18n="lgn_email">Correo electrónico</label>
                    <input type="email" id="login-email" name="email" autocomplete="email" required>
                </div>
                <div class="auth-field">
                    <label for="login-password" data-i18n="lgn_password">Contraseña</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required minlength="6">
                </div>
                <div class="auth-msg" id="login-msg" role="status" aria-live="polite"></div>
                <button type="submit" class="auth-submit" id="login-submit" data-i18n="lgn_login_submit">Entrar</button>
            </form>

            <!-- SIGNUP -->
            <form class="auth-form" id="form-signup" hidden novalidate>
                <div class="auth-field">
                    <label id="signup-roles-label" data-i18n="lgn_role_q">¿Qué tipo de cuenta necesitas?</label>
                    <div class="auth-roles" id="signup-roles" role="radiogroup" aria-labelledby="signup-roles-label">
                        <label class="auth-role" data-role="empresa">
                            <input type="radio" name="requested_role" value="empresa">
                            <i class="fas fa-building" aria-hidden="true"></i>
                            <strong data-i18n="lgn_role_empresa">Empresa</strong>
                            <span data-i18n="lgn_role_empresa_d">Quiero contratar servicios</span>
                        </label>
                        <label class="auth-role" data-role="empleado">
                            <input type="radio" name="requested_role" value="empleado">
                            <i class="fas fa-user-tie" aria-hidden="true"></i>
                            <strong data-i18n="lgn_role_empleado">Empleado</strong>
                            <span data-i18n="lgn_role_empleado_d">Hago parte del equipo</span>
                        </label>
                    </div>
                </div>
                <div class="auth-field">
                    <label for="signup-name" data-i18n="form_nombre">Nombre completo</label>
                    <input type="text" id="signup-name" name="name" autocomplete="name" required>
                </div>
                <div class="auth-field">
                    <label for="signup-email" data-i18n="lgn_email">Correo electrónico</label>
                    <input type="email" id="signup-email" name="email" autocomplete="email" required>
                </div>
                <div class="auth-field">
                    <label for="signup-password" data-i18n="lgn_password_min">Contraseña (mínimo 6 caracteres)</label>
                    <input type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="6">
                </div>
                <div class="auth-msg" id="signup-msg" role="status" aria-live="polite"></div>
                <button type="submit" class="auth-submit" id="signup-submit" data-i18n="lgn_tab_signup">Crear cuenta</button>
            </form>

            <p class="auth-foot">
                <span data-i18n="lgn_foot_terms">Al continuar aceptas ser contactado por Motor Advertising.</span><br>
                <a href="/" data-i18n="lgn_back_home">← Volver al inicio</a> · <a href="/paginas/planes/" data-i18n="lgn_view_plans">Ver planes</a>
            </p>
        </div>
    </main>

    <script src="/script.js?v=5.8" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/assets/js/auth.js?v=1.1" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        'use strict';

        var tabLogin = document.getElementById('tab-login');
        var tabSignup = document.getElementById('tab-signup');
        var formLogin = document.getElementById('form-login');
        var formSignup = document.getElementById('form-signup');

        function showTab(which) {
            var isLogin = which === 'login';
            tabLogin.classList.toggle('active', isLogin);
            tabSignup.classList.toggle('active', !isLogin);
            tabLogin.setAttribute('aria-selected', String(isLogin));
            tabSignup.setAttribute('aria-selected', String(!isLogin));
            formLogin.hidden = !isLogin;
            formSignup.hidden = isLogin;
        }

        tabLogin.addEventListener('click', function () { showTab('login'); });
        tabSignup.addEventListener('click', function () { showTab('signup'); });
        if (window.location.hash === '#registro') showTab('signup');

        function setMsg(el, text, type) {
            el.textContent = text;
            el.classList.remove('error', 'ok');
            el.classList.add('show', type);
        }
        function clearMsg(el) {
            el.textContent = '';
            el.classList.remove('show', 'error', 'ok');
        }

        function friendlyError(err) {
            var m = (err && err.message) || '';
            if (/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
            if (/already registered/i.test(m)) return 'Ese correo ya tiene una cuenta. Inicia sesión.';
            if (/at least 6/i.test(m)) return 'La contraseña debe tener mínimo 6 caracteres.';
            if (/email not confirmed/i.test(m)) return 'Confirma tu correo antes de entrar (revisa tu bandeja).';
            if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera un momento e intenta de nuevo.';
            return 'No se pudo completar. Intenta de nuevo. (' + m + ')';
        }

        // Si MotorAuth no cargó (sin red / CDN caído), avisar.
        if (!window.MotorAuth) {
            setMsg(document.getElementById('login-msg'), 'No se pudo cargar el sistema de acceso. Recarga la página.', 'error');
            return;
        }

        // Si ya hay sesión, ir directo al panel.
        window.MotorAuth.getSession().then(function (res) {
            if (res && res.data && res.data.session) {
                window.location.replace('/paginas/perfil/');
            }
        });

        /* Selector de tipo de cuenta (registro) */
        var selectedRole = '';
        document.querySelectorAll('#signup-roles .auth-role').forEach(function (card) {
            card.addEventListener('click', function () {
                selectedRole = card.getAttribute('data-role');
                document.querySelectorAll('#signup-roles .auth-role').forEach(function (c) {
                    c.classList.toggle('selected', c === card);
                });
            });
        });

        /* Google — signInWithOAuth resuelve con {data,error}, nunca rechaza */
        document.getElementById('btn-google').addEventListener('click', function () {
            window.MotorAuth.signInWithGoogle('/paginas/perfil/').then(function (res) {
                if (res && res.error) {
                    var m = /provider is not enabled/i.test(res.error.message || '')
                        ? 'El acceso con Google aún no está habilitado. Usa tu correo o intenta más tarde.'
                        : friendlyError(res.error);
                    setMsg(document.getElementById('login-msg'), m, 'error');
                }
            });
        });

        /* Login con email */
        formLogin.addEventListener('submit', function (e) {
            e.preventDefault();
            var msg = document.getElementById('login-msg');
            var btn = document.getElementById('login-submit');
            clearMsg(msg);

            var email = document.getElementById('login-email').value.trim();
            var pass = document.getElementById('login-password').value;
            if (!email || !pass) { setMsg(msg, 'Completa correo y contraseña.', 'error'); return; }

            btn.disabled = true;
            window.MotorAuth.signInEmail(email, pass).then(function (res) {
                if (res.error) { setMsg(msg, friendlyError(res.error), 'error'); btn.disabled = false; return; }
                setMsg(msg, '¡Listo! Entrando…', 'ok');
                window.location.href = '/paginas/perfil/';
            }).catch(function (err) {
                setMsg(msg, friendlyError(err), 'error');
                btn.disabled = false;
            });
        });

        /* Registro con email */
        formSignup.addEventListener('submit', function (e) {
            e.preventDefault();
            var msg = document.getElementById('signup-msg');
            var btn = document.getElementById('signup-submit');
            clearMsg(msg);

            var name = document.getElementById('signup-name').value.trim();
            var email = document.getElementById('signup-email').value.trim();
            var pass = document.getElementById('signup-password').value;
            if (!selectedRole) { setMsg(msg, 'Elige si tu cuenta es de Empresa o de Empleado.', 'error'); return; }
            if (!name || !email || !pass) { setMsg(msg, 'Completa todos los campos.', 'error'); return; }
            if (pass.length < 6) { setMsg(msg, 'La contraseña debe tener mínimo 6 caracteres.', 'error'); return; }

            btn.disabled = true;
            window.MotorAuth.signUpEmail(email, pass, name, selectedRole).then(function (res) {
                if (res.error) { setMsg(msg, friendlyError(res.error), 'error'); btn.disabled = false; return; }
                // Con "Confirm email" activo, un correo ya registrado devuelve un
                // usuario ofuscado con identities: [] en lugar de un error.
                var u = res.data && res.data.user;
                if (u && u.identities && u.identities.length === 0) {
                    setMsg(msg, 'Ese correo ya tiene una cuenta. Inicia sesión.', 'error');
                    btn.disabled = false;
                    showTab('login');
                    return;
                }
                var needsConfirm = res.data && res.data.user && !res.data.session;
                if (needsConfirm) {
                    setMsg(msg, 'Cuenta creada. Revisa tu correo y confirma la cuenta para poder entrar.', 'ok');
                    btn.disabled = false;
                } else {
                    setMsg(msg, '¡Cuenta creada! Entrando…', 'ok');
                    window.location.href = '/paginas/perfil/';
                }
            }).catch(function (err) {
                setMsg(msg, friendlyError(err), 'error');
                btn.disabled = false;
            });
        });
    });
    </script>
    <!-- Sticky Language Switcher -->
    <div class="lang-switcher-floating" id="lang-switcher-floating">
        <button class="lang-btn active" data-lang="es" title="Español">ES</button>
        <span class="lang-divider">|</span>
        <button class="lang-btn" data-lang="en" title="English">EN</button>
    </div>

</body>
</html>

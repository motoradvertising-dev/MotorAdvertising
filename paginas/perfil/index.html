<head>

    <style>
    .panel-wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 140px 24px 90px;
        min-height: 80vh;
    }
    .panel-eyebrow {
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #59a8c4;
        margin-bottom: 10px;
    }
    .panel-title {
        font-family: var(--font-heading);
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-primary);
        margin-bottom: 6px;
    }
    .panel-sub { color: var(--text-secondary); font-size: .95rem; margin-bottom: 36px; }

    .panel-loading {
        text-align: center;
        color: var(--text-secondary);
        padding: 80px 0;
        font-size: .95rem;
    }
    .panel-loading i { color: #59a8c4; margin-right: 8px; }

    .panel-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 34px 30px;
        margin-bottom: 22px;
    }

    /* Estado pendiente */
    .pend-hero { text-align: center; padding: 50px 26px; }
    .pend-hero .pend-icon {
        width: 74px; height: 74px;
        margin: 0 auto 22px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.8rem; color: #fff;
        background: linear-gradient(135deg, var(--accent-color), #0e7490);
        box-shadow: 0 0 30px var(--accent-glow);
    }
    .pend-hero h2 {
        font-family: var(--font-heading);
        font-size: 1.6rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-primary);
        margin-bottom: 10px;
    }
    .pend-hero p { color: var(--text-secondary); font-size: .95rem; line-height: 1.7; max-width: 520px; margin: 0 auto 24px; }
    .pend-wa {
        display: inline-flex; align-items: center; gap: 10px;
        background: linear-gradient(135deg, #1eae54, #25d366);
        color: #fff; text-decoration: none;
        padding: 13px 26px; border-radius: 50px;
        font-weight: 600; font-size: .88rem;
        transition: all .25s ease;
    }
    .pend-wa:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(37,211,102,.4); }

    .pend-roles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 480px; margin: 26px auto 0; }
    .pend-role {
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        background: rgba(255,255,255,.04);
        color: var(--text-secondary);
        padding: 20px 14px;
        cursor: pointer;
        text-align: center;
        font-family: var(--font-body);
        font-size: .8rem;
        transition: all .2s ease;
    }
    .pend-role i { display: block; font-size: 1.3rem; color: #59a8c4; margin-bottom: 8px; }
    .pend-role strong { display: block; color: var(--text-primary); text-transform: uppercase; letter-spacing: .5px; font-size: .85rem; margin-bottom: 4px; }
    .pend-role:hover { border-color: var(--accent-color); transform: translateY(-2px); }
    .pend-role.selected { border-color: var(--accent-color); background: rgba(15,57,74,.3); }

    /* Chips */
    .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 14px; border-radius: 50px;
        font-size: .72rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 1px;
    }
    .chip-activo    { background: rgba(40,160,90,.15);  border: 1px solid rgba(40,160,90,.45);  color: #7fd8a4; }
    .chip-pausado   { background: rgba(230,170,50,.12); border: 1px solid rgba(230,170,50,.4);  color: #ffce7a; }
    .chip-cancelado { background: rgba(200,60,50,.12);  border: 1px solid rgba(200,60,50,.4);   color: #ff9c92; }
    .chip-sin_plan  { background: rgba(255,255,255,.06); border: 1px solid var(--glass-border); color: var(--text-secondary); }

    /* Dashboard empresa */
    .plan-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
    .plan-head h3 {
        font-family: var(--font-heading);
        font-size: 1.35rem; text-transform: uppercase; letter-spacing: 1px;
        color: var(--text-primary);
    }
    .plan-head .plan-precio { color: #59a8c4; font-weight: 600; font-size: .92rem; }

    .mods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 8px; }
    .mod-card {
        display: flex; align-items: center; gap: 12px;
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        background: rgba(255,255,255,.03);
        padding: 15px 16px;
        color: var(--text-secondary);
        font-size: .85rem;
    }
    .mod-card i { color: #7fd8a4; flex-shrink: 0; }

    .panel-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .panel-btn {
        display: inline-flex; align-items: center; gap: 9px;
        padding: 12px 22px; border-radius: 50px;
        border: 1px solid var(--glass-border);
        background: rgba(255,255,255,.05);
        color: var(--text-primary);
        font-family: var(--font-body); font-size: .82rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: .5px;
        text-decoration: none; cursor: pointer;
        transition: all .25s ease;
    }
    .panel-btn:hover { border-color: var(--accent-color); box-shadow: 0 0 16px var(--accent-glow); transform: translateY(-2px); }
    .panel-btn.primary { background: linear-gradient(135deg, var(--accent-color), #0e7490); border-color: transparent; color: #fff; }
    .panel-btn.wa { background: linear-gradient(135deg, #1eae54, #25d366); border-color: transparent; color: #fff; }

    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-state i { font-size: 2rem; color: #59a8c4; margin-bottom: 14px; }
    .empty-state h3 { font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 1px; color: var(--text-primary); margin-bottom: 8px; }
    .empty-state p { color: var(--text-secondary); font-size: .9rem; max-width: 440px; margin: 0 auto; }
    .empty-state .panel-actions { justify-content: center; }

    /* Superadmin */
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
        border: 1px solid var(--glass-border); border-radius: 14px;
        background: rgba(255,255,255,.03); padding: 20px;
        text-align: center;
    }
    .stat-card .num { font-family: var(--font-heading); font-size: 1.9rem; font-weight: 800; color: var(--text-primary); }
    .stat-card .lbl { color: var(--text-secondary); font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    @media (max-width: 640px) {
        .panel-wrap { padding: 120px 16px 70px; }
        .panel-card { padding: 26px 20px; }
        .pend-roles { grid-template-columns: 1fr; }
    }
    </style>

        }
        function firstName(p) {
            var n = (p.full_name || p.email || '').split('@')[0];
            return esc(n.split(' ')[0] || 'Hola');
        }

        function renderPendiente(p) {
            var chooser = '';
            if (!p.requested_role) {
                chooser =
                    '<p style="margin-top:30px"><strong style="color:var(--text-primary)">Mientras tanto, cuéntanos qué tipo de cuenta necesitas:</strong></p>' +
                    '<div class="pend-roles">' +
                        '<button type="button" class="pend-role" data-role="empresa"><i class="fas fa-building"></i><strong>Empresa</strong>Quiero contratar servicios</button>' +
                        '<button type="button" class="pend-role" data-role="empleado"><i class="fas fa-user-tie"></i><strong>Empleado</strong>Hago parte del equipo</button>' +
                    '</div>';
            } else {
                chooser = '<p style="margin-top:18px;font-size:.82rem">Tu solicitud quedó registrada como <strong style="color:#59a8c4">' + esc(p.requested_role) + '</strong>.</p>';
            }
            show(
                '<div class="panel-card pend-hero">' +
                    '<div class="pend-icon"><i class="fas fa-user-clock"></i></div>' +
                    '<h2>¡Espera! Estamos asignando tu rol</h2>' +
                    '<p>Tu cuenta fue creada correctamente y nuestro equipo la está revisando para activarte el acceso. ' +
                    'Escríbenos por WhatsApp para que el proceso sea más rápido.</p>' +
                    '<a class="pend-wa" href="' + WA + '" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Escribir a Motor Advertising</a>' +
                    chooser +
                '</div>'
            );
            content.querySelectorAll('.pend-role').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var role = btn.getAttribute('data-role');
                    content.querySelectorAll('.pend-role').forEach(function (c) { c.classList.toggle('selected', c === btn); });
                    var prev = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i><strong>Guardando…</strong>';
                    window.MotorAuth.client.from('profiles')
                        .update({ requested_role: role })
                        .eq('id', p.id)
                        .then(function (r) {
                            if (r.error) {
                                btn.classList.remove('selected');
                                btn.innerHTML = prev;
                                alert('No se pudo guardar tu elección. Revisa tu conexión e intenta de nuevo.');
                                return;
                            }
                            p.requested_role = role;
                            window.MotorAuth.getProfile(true).then(function () { renderPendiente(p); });
                        });
                });
            });
        }

        function renderEmpresa(p) {
            var plan = p.plan && PLANS[p.plan];
            var html = '<p class="panel-eyebrow">Panel de cliente</p>' +
                '<h1 class="panel-title">Hola, ' + firstName(p) + '</h1>' +
                '<p class="panel-sub">Este es el estado de tu cuenta con Motor Advertising.</p>';

            if (plan) {
                var mods = plan.features.map(function (f) {
                    return '<div class="mod-card"><i class="fas fa-circle-check"></i><span>' + esc(f) + '</span></div>';
                }).join('');
                html +=
                    '<div class="panel-card">' +
                        '<div class="plan-head">' +
                            '<div><h3>' + esc(plan.nombre) + '</h3><span class="plan-precio">' + esc(plan.precio) + '</span></div>' +
                            '<span class="chip chip-' + esc(p.plan_status) + '">' + esc(STATUS_LABEL[p.plan_status] || p.plan_status) + '</span>' +
                        '</div>' +
                        '<div class="mods-grid">' + mods + '</div>' +
                        '<div class="panel-actions">' +
                            '<a class="panel-btn wa" href="' + WA + '" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Soporte</a>' +
                            '<a class="panel-btn" href="/paginas/planes/"><i class="fas fa-layer-group"></i> Cambiar de plan</a>' +
                            '<a class="panel-btn" href="/paginas/contacto/"><i class="fas fa-calendar-check"></i> Agendar una cita</a>' +
                        '</div>' +
                    '</div>';
            } else {
                html +=
                    '<div class="panel-card empty-state">' +
                        '<i class="fas fa-rocket"></i>' +
                        '<h3>Aún no tienes un plan activo</h3>' +
                        '<p>Explora nuestros planes de Webs y Marketing. Cuando actives uno, aquí verás tu dashboard con todo lo incluido.</p>' +
                        '<div class="panel-actions">' +
                            '<a class="panel-btn primary" href="/paginas/planes/"><i class="fas fa-layer-group"></i> Ver planes</a>' +
                            '<a class="panel-btn wa" href="' + WA + '" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Hablar con Motor</a>' +
                        '</div>' +
                    '</div>';
            }
            show(html);
        }

        function renderEmpleado(p) {
            show(
                '<p class="panel-eyebrow">Panel de equipo</p>' +
                '<h1 class="panel-title">Hola, ' + firstName(p) + '</h1>' +
                '<p class="panel-sub">Bienvenido al equipo de Motor Advertising.</p>' +
                '<div class="panel-card">' +
                    '<div class="mods-grid">' +
                        '<div class="mod-card"><i class="fas fa-circle-check"></i><span>Cuenta de empleado activa</span></div>' +
                        '<div class="mod-card"><i class="fas fa-circle-check"></i><span>Correo: ' + esc(p.email) + '</span></div>' +
                    '</div>' +
                    '<div class="panel-actions">' +
                        '<a class="panel-btn wa" href="' + WA + '" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> Canal del equipo</a>' +
                        '<a class="panel-btn" href="/paginas/services/"><i class="fas fa-briefcase"></i> Servicios</a>' +
                    '</div>' +
                '</div>'
            );
        }

        function renderAdmin(p) {
            show(
                '<p class="panel-eyebrow">Superusuario</p>' +
                '<h1 class="panel-title">Hola, ' + firstName(p) + '</h1>' +
                '<p class="panel-sub">Cuenta maestra de Motor Advertising.</p>' +
                '<div class="admin-stats" id="admin-stats"></div>' +
                '<div class="panel-card empty-state">' +
                    '<i class="fas fa-users-gear"></i>' +
                    '<h3>Gestión de usuarios</h3>' +
                    '<p>Revisa quién ha creado cuenta, asigna roles (empresa / empleado) y administra la suscripción de cada cliente.</p>' +
                    '<div class="panel-actions">' +
                        '<a class="panel-btn primary" href="/paginas/gestion/"><i class="fas fa-table-list"></i> Abrir Gestión</a>' +
                    '</div>' +
                '</div>'
            );
            window.MotorAuth.client.from('profiles').select('role, plan_status').then(function (r) {
                if (r.error || !r.data) return;
                var rows = r.data;
                var stats = [
                    ['Usuarios', rows.length],
                    ['Pendientes', rows.filter(function (x) { return x.role === 'pendiente'; }).length],
                    ['Empresas', rows.filter(function (x) { return x.role === 'empresa'; }).length],
                    ['Planes activos', rows.filter(function (x) { return x.plan_status === 'activo'; }).length]
                ];
                document.getElementById('admin-stats').innerHTML = stats.map(function (s) {
                    return '<div class="stat-card"><div class="num">' + s[1] + '</div><div class="lbl">' + s[0] + '</div></div>';
                }).join('');
            });
        }

        function fail(msg) {
            show('<div class="panel-card empty-state"><i class="fas fa-triangle-exclamation"></i><h3>Algo salió mal</h3><p>' + esc(msg) + '</p>' +
                 '<div class="panel-actions"><button class="panel-btn primary" onclick="location.reload()"><i class="fas fa-rotate-right"></i> Reintentar</button></div></div>');
        }

        if (!window.MotorAuth) { fail('No se pudo cargar el sistema de acceso. Revisa tu conexión.'); return; }

        // Si el callback de Google/confirmación llega con error en el hash
        // (#error=...), mostrarlo en vez de rebotar en silencio al login.
        var hash = window.location.hash || '';
        if (hash.indexOf('error') !== -1) {
            var hp = new URLSearchParams(hash.replace(/^#/, ''));
            if (hp.get('error')) {
                var d = hp.get('error_description') || 'No se pudo completar el acceso.';
                fail(decodeURIComponent(d.replace(/\+/g, ' ')) + ' Intenta iniciar sesión de nuevo.');
                history.replaceState(null, '', window.location.pathname);
                return;
            }
        }

        window.MotorAuth.getSession().then(function (res) {
            var session = res && res.data ? res.data.session : null;
            if (!session) { window.location.replace('/paginas/login/'); return; }
            window.MotorAuth.getProfile().then(function (r) {
                if (r && r.error) { fail('No pudimos cargar tu perfil. Revisa tu conexión e intenta de nuevo.'); return; }
                var p = r && r.data;
                if (!p) { fail('No pudimos cargar tu perfil. Intenta de nuevo en unos segundos.'); return; }
                if (p.role === 'superadmin') renderAdmin(p);
                else if (p.role === 'empresa') renderEmpresa(p);
                else if (p.role === 'empleado') renderEmpleado(p);
                else renderPendiente(p);
            });
        });
    });
    </script>

    <!-- Sticky Language Switcher -->
    <div class="lang-switcher-floating" id="lang-switcher-floating">
        <button class="lang-btn active" data-lang="es" title="Español">ES</button>
        <span class="lang-divider">|</span>
        <button class="lang-btn" data-lang="en" title="English">EN</button>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versión anterior | Motor Advertising</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/assets/favicon.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    /* Visor de versiones anteriores de una página: barra de Motor arriba y la
       versión, tal como era en ese commit, en un iframe debajo. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
        display: flex; flex-direction: column;
        background: #000; color: #fff;
        font-family: 'Montserrat', sans-serif;
    }
    .vb {
        flex-shrink: 0;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
        padding: 12px 20px;
        background: #0b0d10;
        border-bottom: 1px solid rgba(255,206,122,.35);
    }
    .vb a { color: inherit; text-decoration: none; }
    .vb-back {
        display: inline-flex; align-items: center; gap: 8px;
        color: #59a8c4 !important; font-size: .74rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
    }
    .vb-info { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .vb-tag { color: #ffce7a; font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .vb-t { font-family: 'League Spartan', sans-serif; font-size: 1.05rem; font-weight: 800; letter-spacing: .5px; overflow-wrap: anywhere; }
    .vb-meta { color: #a0a0a0; font-size: .76rem; overflow-wrap: anywhere; }
    .vb-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .vb-btn {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 8px 14px; border-radius: 50px;
        border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.04);
        font-size: .72rem; font-weight: 600; white-space: nowrap;
        transition: border-color .2s ease;
    }
    .vb-btn:hover { border-color: #59a8c4; }
    .vb-btn.cur { border-color: rgba(127,216,164,.5); color: #7fd8a4; }
    .vb-btn[aria-disabled="true"] { opacity: .35; pointer-events: none; }
    .vb-pos { color: #a0a0a0; font-size: .74rem; padding: 0 4px; white-space: nowrap; }
    #vb-frame { flex: 1; width: 100%; border: 0; background: #fff; }
    .vb-msg { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; color: #a0a0a0; font-size: .92rem; line-height: 1.7; }
    .vb-msg i { color: #59a8c4; margin-right: 8px; }
    .vb-msg a { color: #59a8c4; }
    @media (max-width: 640px) {
        .vb { padding: 10px 14px; }
        .vb-nav { width: 100%; }
    }
    </style>
</head>
<body>
    <header class="vb">
        <a class="vb-back" href="/paginas/gestion/#propuestas"><i class="fas fa-arrow-left" aria-hidden="true"></i> Gestión</a>
        <div class="vb-info">
            <span class="vb-tag" id="vb-tag">Versión anterior · solo lectura</span>
            <strong class="vb-t" id="vb-t">Cargando…</strong>
            <span class="vb-meta" id="vb-meta"></span>
        </div>
        <nav class="vb-nav" id="vb-nav" aria-label="Versiones" hidden>
            <a class="vb-btn" id="vb-prev" href="#"><i class="fas fa-chevron-left" aria-hidden="true"></i> Anterior</a>
            <span class="vb-pos" id="vb-pos"></span>
            <a class="vb-btn" id="vb-next" href="#">Siguiente <i class="fas fa-chevron-right" aria-hidden="true"></i></a>
            <a class="vb-btn cur" id="vb-cur" href="#" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i> Versión actual</a>
        </nav>
    </header>
    <div class="vb-msg" id="vb-msg"><span><i class="fas fa-circle-notch fa-spin"></i> Cargando versión…</span></div>
    <iframe id="vb-frame" title="Versión anterior de la página" hidden></iframe>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/assets/js/auth.js?v=1.2" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        'use strict';

        var msg = document.getElementById('vb-msg');
        var frame = document.getElementById('vb-frame');
        var qs = new URLSearchParams(window.location.search);
        var slug = qs.get('p') || '';
        var sha = (qs.get('v') || '').toLowerCase();

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function fail(html) {
            frame.hidden = true;
            msg.hidden = false;
            msg.innerHTML = '<span>' + html + '</span>';
        }
        function fechaHora(iso) {
            try {
                var d = new Date(iso);
                return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }) + ', ' +
                       d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
            } catch (e) { return ''; }
        }
        function verUrl(v) {
            return '/paginas/gestion/version/?p=' + encodeURIComponent(slug) + '&v=' + encodeURIComponent(v.sha);
        }
        function setNav(a, v) {
            if (v) { a.href = verUrl(v); a.removeAttribute('aria-disabled'); }
            else { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); }
        }

        function show(data) {
            var page = (data.paginas || []).filter(function (p) { return p.slug === slug; })[0];
            var vs = page && page.versiones || [];
            var i = -1;
            vs.forEach(function (v, k) { if (v.sha === sha) i = k; });
            // Solo versiones que están en el índice: el visor no carga rutas arbitrarias.
            if (!page || i === -1) {
                fail('No encontramos esa versión. <a href="/paginas/gestion/#propuestas">Volver a Propuestas</a>');
                return;
            }
            var v = vs[i], n = vs.length, actual = i === 0;
            document.title = 'v' + (n - i) + ' · ' + (v.titulo || page.titulo) + ' | Motor Advertising';
            document.getElementById('vb-tag').textContent = actual ? 'Versión actual · solo lectura' : 'Versión anterior · solo lectura';
            document.getElementById('vb-t').textContent = v.titulo || page.titulo;
            document.getElementById('vb-meta').textContent = 'v' + (n - i) + ' de ' + n + ' · ' + fechaHora(v.fecha) + ' · ' + v.mensaje;
            document.getElementById('vb-pos').textContent = 'v' + (n - i) + ' / ' + n;
            setNav(document.getElementById('vb-prev'), vs[i + 1]);   // más antigua
            setNav(document.getElementById('vb-next'), vs[i - 1]);   // más nueva
            document.getElementById('vb-cur').href = page.url;
            document.getElementById('vb-nav').hidden = false;

            var raw = 'https://raw.githubusercontent.com/' + data.repo + '/' + v.sha + '/' + v.ruta.split('/').map(encodeURIComponent).join('/');
            fetch(raw).then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            }).then(function (html) {
                // Las rutas relativas y /assets se resuelven contra el sitio en vivo.
                var base = '<base href="' + window.location.origin + page.url + '">';
                html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + base; }) : base + html;
                frame.srcdoc = html;
                msg.hidden = true;
                frame.hidden = false;
            }).catch(function () {
                fail('No se pudo descargar esa versión desde GitHub. Revisa tu conexión e intenta de nuevo.');
            });
        }

        if (!window.MotorAuth) { fail('No se pudo cargar el sistema de acceso. Recarga la página.'); return; }
        if (!slug || !/^[0-9a-f]{7,40}$/.test(sha)) { fail('Falta la versión. <a href="/paginas/gestion/#propuestas">Volver a Propuestas</a>'); return; }

        window.MotorAuth.getSession().then(function (res) {
            var session = res && res.data ? res.data.session : null;
            if (!session) { window.location.replace('/paginas/login/'); return; }
            window.MotorAuth.getProfile().then(function (r) {
                var p = r && r.data;
                if (!p || p.role !== 'superadmin') {
                    fail('<i class="fas fa-lock" style="color:#ff9c92"></i> Acceso restringido. <a href="/paginas/perfil/">Ir a mi panel</a>');
                    return;
                }
                fetch('/paginas/gestion/paginas.json', { cache: 'no-store' })
                    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(show)
                    .catch(function () { fail('No se pudo cargar el índice de páginas. Recarga para intentarlo de nuevo.'); });
            });
        });
    });
    </script>
</body>
</html>
